<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <!-- Tek değişken bu: viewport-fit=cover. Başka hiçbir şey yok. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Safari edge-to-edge testi</title>
    <style>
      /*
        MİNİMAL İZOLE TEST.
        - Next.js yok, React yok, hiçbir component yok.
        - fixed / sticky element yok.
        - overflow container yok.
        - 100vh / 100dvh / min-height yok.
        - transform / filter / backdrop-filter yok.
        - theme-color yok.

        Sadece: html > body > main, ve main'de aşağıya kadar uzanan bir degrade.
        Sayfa uzun (scroll edilebilir). Amaç: iOS 26 Safari alt floating
        adres çubuğunun ARKASINDA bu degradenin ekranın fiziksel alt kenarına
        kadar devam edip etmediğini görmek.
      */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      main {
        /* Canlı, koyudan açığa bir degrade: çubuğun arkasında içerik varsa
           net görünür (Midas'taki mavi gibi). */
        background: linear-gradient(180deg, #1c56f3 0%, #7c3aed 45%, #0a0d18 100%);
        color: #fff;
        font-family: -apple-system, system-ui, sans-serif;
      }
      section {
        min-height: 60vh; /* sadece sayfayı uzatmak için; scroll oluşsun diye */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        padding: 24px;
      }
      /* En alttaki blok bilerek parlak turuncu: çubuğun arkasında bunu
         görüyorsan içerik fiziksel alt kenara kadar uzanıyor demektir. */
      .dip {
        background: #ff7a1a;
        color: #0a0d18;
        min-height: 70vh;
      }
    </style>
  </head>
  <body>
    <main>
      <section>1 · En üst — buraya bak: durum çubuğu içerikle akıyor mu?</section>
      <section>2 · Ortalarda scroll et</section>
      <section>3 · Biraz daha aşağı</section>
      <section class="dip">
        4 · EN ALT — turuncu, ekranın fiziksel alt kenarına kadar
        gidiyor mu? Safari adres çubuğu bu turuncunun ÜSTÜNDE mi duruyor,
        yoksa altında ayrı gri bir bant mı var?
      </section>
    </main>
  </body>
</html>

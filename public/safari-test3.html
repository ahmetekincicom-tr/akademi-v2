<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Safari testi 3 — footer eklendi</title>
    <style>
      /*
        TEST 3 = TEST 1 + tek fark: en altta AKIŞTA (fixed/sticky değil) koyu
        bir FOOTER (bg-ink). Bizim PublicFooter'ın konumunu taklit ediyor.

        Amaç: en alta inince footer'ın altında / Safari çubuğunun arkasında
        gri bant çıkıyor mu? Test 1'de (footer yok) bant yoktu.

        Hâlâ: html/body'de bg yok, header yok, overflow yok, 100vh yok,
        transform yok, fixed element yok, theme-color yok.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, system-ui, sans-serif;
      }
      main {
        background: linear-gradient(180deg, #1c56f3 0%, #7c3aed 100%);
        color: #fff;
      }
      section {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        padding: 24px;
      }
      footer {
        background: #0a0d18; /* bg-ink */
        color: #fff;
        padding: 60px 24px 80px;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <section>1 · Üst</section>
      <section>2 · Aşağı scroll et</section>
    </main>
    <footer>
      EN ALT KOYU FOOTER — bu koyu alan ekranın fiziksel alt kenarına
      gidiyor mu, yoksa altında / Safari çubuğunun arkasında gri bant mı var?
    </footer>
  </body>
</html>

<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Test 7 — aynısı + viewport'u kaplayan kapsayıcı</title>
<style>
  html,body{margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif}
  /* TEK FARK: her şeyi saran, viewport yüksekliğinde, arka planlı bir kapsayıcı. */
  .kapsayici{min-height:100dvh;background:#fff}
  header{position:sticky;top:0;background:rgba(255,255,255,.9);border-bottom:1px solid rgba(10,13,24,.09);height:74px;display:flex;align-items:center;padding:0 20px;font-weight:700}
  section{background:#fff;color:#0a0d18;min-height:75vh;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;text-align:center;padding:24px}
  footer{background:#0a0d18;color:#fff;padding:60px 24px 90px;text-align:center;font-weight:700}
</style></head>
<body>
  <div class="kapsayici">
    <header>Header</header>
    <section>Beyaz section 1</section>
    <section>Beyaz section 2</section>
    <footer>KOYU FOOTER — kapsayıcı VAR. Gri bant gitti mi?</footer>
  </div>
</body></html>

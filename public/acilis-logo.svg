    <path d="M128 18V382M272 18V382M18 118H382M18 300H382"/>
  </g>
  <circle cx="200" cy="214" r="147" fill="none" stroke="#E9EDF6" stroke-width="1.8"/>

  <!-- Bezier yayı ve tutamaçları -->

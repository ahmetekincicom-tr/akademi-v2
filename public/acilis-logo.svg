  </g>
  <g fill="#2C63F5">
    <rect x="192" y="68" width="16" height="16" rx="2.5"/>
    <rect x="144" y="80" width="13" height="13" rx="2"/>
    <rect x="243" y="80" width="13" height="13" rx="2"/>
    <rect x="121.5" y="93.5" width="13" height="13" rx="2"/>
    <rect x="265.5" y="93.5" width="13" height="13" rx="2"/>
  </g>
  <g fill="#FFFFFF" stroke="#2C63F5" stroke-width="4">

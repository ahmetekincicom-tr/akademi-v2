<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Safari testi 2 — sticky header eklendi</title>
    <style>
      /*
        TEST 2 = TEST 1 + tek fark: STICKY HEADER (bg-white/90, sticky top:0).
        Bizim PublicHeader'ın mobildeki hâlini birebir taklit ediyor
        (backdrop-filter mobilde zaten kapalı, o yüzden yok).

        Amaç: Test 1'de gri bant yoktu. Bu sayfada sticky header yüzünden gri
        bant ÇIKIYORSA, iOS 26 Safari toolbar'ı bu sticky elementten
        besliyor demektir ve suçlu kesinleşir.

        Hâlâ: html/body'de bg yok, overflow yok, 100vh yok, transform yok,
        fixed element yok (header sticky, fixed değil), theme-color yok.
      */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 60;
        /* PublicHeader ile aynı: yarı saydam beyaz zemin, alt çizgi */
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid rgba(10, 13, 24, 0.09);
        height: 74px;
        display: flex;
        align-items: center;
        padding: 0 20px;
        font-family: -apple-system, system-ui, sans-serif;
        font-weight: 700;
        color: #0a0d18;
      }
      main {
        background: linear-gradient(180deg, #1c56f3 0%, #7c3aed 45%, #0a0d18 100%);
        color: #fff;
        font-family: -apple-system, system-ui, sans-serif;
      }
      section {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        padding: 24px;
      }
      .dip {
        background: #ff7a1a;
        color: #0a0d18;
        min-height: 70vh;
      }
    </style>
  </head>
  <body>
    <header>Sticky header (bg-white/90)</header>
    <main>
      <section>1 · Üst</section>
      <section>2 · Orta</section>
      <section>3 · Aşağı</section>
      <section class="dip">
        4 · EN ALT — turuncu fiziksel alt kenara gidiyor mu, yoksa altında
        gri bant mı var? (Test 1'de bant YOKTU.)
      </section>
    </main>
  </body>
</html>
